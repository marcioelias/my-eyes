name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Build first. Every package downstream of @my-eyes/core resolves it
      # through its published entry points — dist/index.js and dist/index.d.ts —
      # so without this both the typecheck and the tests fail on a module that
      # simply has not been emitted yet. Workspaces build in dependency order.
      - name: Build
        run: npm run build --workspaces --if-present

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Test
        run: npm test

      # Compiling the stylesheet through Tailwind is the only way to catch a
      # broken @apply, an unknown token or a malformed selector.
      - name: Compile stylesheet
        run: npx @tailwindcss/cli -i packages/core/tests/probe.css -o packages/core/tests/out.css

      - name: Check the stylesheet is not empty
        run: test "$(wc -c < packages/core/tests/out.css)" -gt 10000

  laravel:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '12.*', dependencies: highest }
          - { php: '8.3', laravel: '12.*', dependencies: highest }
          - { php: '8.4', laravel: '13.*', dependencies: highest }
          - { php: '8.5', laravel: '13.*', dependencies: highest }
          # Catches accidental reliance on a version newer than composer.json allows.
          - { php: '8.2', laravel: '12.*', dependencies: lowest }

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Pin the Laravel version under test
        run: >
          composer require
          "illuminate/support:${{ matrix.laravel }}"
          "illuminate/view:${{ matrix.laravel }}"
          --no-interaction --no-update

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      # Skipped on the lowest run: it resolves the oldest Pint and PHPStan too,
      # and those tools' minimum versions say nothing about this package.
      - name: Lint
        if: matrix.dependencies != 'lowest'
        run: vendor/bin/pint --test

      - name: Static analysis
        if: matrix.dependencies != 'lowest'
        run: vendor/bin/phpstan analyse --no-progress

      # The icon set is generated from resources/icons; a hand-edited generated
      # file or a forgotten run shows up here rather than in a release.
      - name: Icons are generated
        if: matrix.dependencies != 'lowest'
        run: php bin/build-icons.php --check

      - name: Tests
        run: vendor/bin/pest --compact

  showcase:
    name: Showcase builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - run: npm ci

      - run: npm run build --workspaces --if-present

      - run: npx @tailwindcss/cli -i packages/core/tests/probe.css -o packages/core/tests/out.css

      - uses: ramsey/composer-install@v3

      # Renders every component through Blade against a real database, so a
      # broken view fails here even if no test covers it directly.
      - name: Build showcase
        run: php playground/build.php

      - uses: actions/upload-artifact@v4
        with:
          name: showcase
          path: playground/index.html
          retention-days: 14
