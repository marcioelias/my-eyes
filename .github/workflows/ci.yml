name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Build
        run: npm run build --workspaces --if-present

      # Compiling the stylesheet through Tailwind is the only way to catch a
      # broken @apply, an unknown token or a malformed selector.
      - name: Compile stylesheet
        run: npx @tailwindcss/cli -i packages/core/tests/probe.css -o packages/core/tests/out.css

      - name: Check the stylesheet is not empty
        run: test "$(wc -c < packages/core/tests/out.css)" -gt 10000

  laravel:
    name: Laravel (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        dependencies: [highest]
        include:
          # Guards against relying on a version newer than composer.json allows.
          - php: '8.2'
            dependencies: lowest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Lint
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Tests
        run: vendor/bin/pest --compact

  showcase:
    name: Showcase builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - run: npm ci

      - run: npm run build --workspaces --if-present

      - run: npx @tailwindcss/cli -i packages/core/tests/probe.css -o packages/core/tests/out.css

      - uses: ramsey/composer-install@v3

      # Renders every component through Blade against a real database, so a
      # broken view fails here even if no test covers it directly.
      - name: Build showcase
        run: php playground/build.php

      - uses: actions/upload-artifact@v4
        with:
          name: showcase
          path: playground/index.html
          retention-days: 14
