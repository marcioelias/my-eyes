name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  # Nothing is published before the full suite passes on every supported
  # version — a tag must not be able to skip CI.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing (OIDC) needs npm 11.5.1 or later. Pinned to 11 so the
      # npm 12 install-time defaults arrive as a decision, not as a side effect.
      - run: npm install -g npm@11

      - run: npm ci

      # The npm packages are versioned together, so one tag describes both.
      - name: Check the tag matches every package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"

          for PACKAGE in core vue react; do
            VERSION="$(node -p "require('./packages/$PACKAGE/package.json').version")"

            if [ "$TAG" != "$VERSION" ]; then
              echo "Tag $TAG does not match @my-eyes/$PACKAGE version $VERSION." >&2
              echo "Bump packages/$PACKAGE/package.json before tagging." >&2
              exit 1
            fi
          done

      - name: Build the distributed files
        run: npm run build --workspaces --if-present

      # Newest package first, deliberately. npm does not resolve peer
      # dependencies at publish time, so the order is free to be chosen for
      # failure behaviour instead — and the package most likely to be refused
      # is the one the token has never published before. Failing on it leaves
      # nothing released, rather than half a release that cannot be undone.
      - name: Publish @my-eyes/react
        run: npm publish --access public
        working-directory: packages/react

      - name: Publish @my-eyes/vue
        run: npm publish --access public
        working-directory: packages/vue

      - name: Publish @my-eyes/core
        run: npm publish --access public
        working-directory: packages/core

      - name: Validate the Composer package
        run: composer validate --strict

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  # Packagist releases from the tag itself — composer.json lives at the repo
  # root for exactly that reason. This nudges it rather than waiting for the
  # webhook, and is skipped when the credentials are not configured.
  packagist:
    name: Notify Packagist
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ vars.PACKAGIST_USERNAME != '' }}

    steps:
      - name: Trigger an update
        run: |
          curl -sSf -XPOST \
            -H 'content-type:application/json' \
            "https://packagist.org/api/update-package?username=${{ vars.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}" \
            -d '{"repository":{"url":"https://github.com/${{ github.repository }}"}}'
